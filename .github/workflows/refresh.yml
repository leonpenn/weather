name: refresh

on:
  schedule:
    # 北京时间每小时 07 分（UTC 整点后 7 分）。工程为常驻的 7 天滚动速查，无窗口期限制
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest forecasts
        run: python fetch_all.py

      - name: Regenerate page if data changed
        run: |
          if git diff --quiet -- data/; then
            echo "NMC 数据无变化，跳过生成"
          else
            python gen_html.py
          fi

      - name: Commit and push
        run: |
          git config user.name "leonpenn"
          git config user.email "leonpenn@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "data refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
